<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Flexbox Navbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">MyBrand</div>

      <!-- Hidden checkbox to toggle mobile menu without JavaScript -->
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <label for="menu-toggle" class="hamburger" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <!-- Navigation List Items -->
      <ul class="nav-links">
        <li><a href="#home" class="active">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="demo-content">
    <h1>Responsive Navigation Bar</h1>
    <p>Resize your browser window below <strong>768px</strong> to see the Flexbox menu collapse into a hamburger icon.</p>
  </main>

</body>
</html>
